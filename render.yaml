services:
  - type: web
    name: kolkata-backend
    env: docker
    envVars:
      - key: MYSQL_HOST
        value: mysql.railway.internal
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: railway
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kolkata-frontend.onrender.com
      - key: APP_URL
        value: https://kolkata-backend.onrender.com/api
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    region: oregon
    plan: starter
    dockerfile: kolkata-backend/Dockerfile

  - type: web
    name: kolkata-frontend
    env: docker
    envVars:
      - key: VITE_API_URL
        value: https://kolkata-backend.onrender.com/api
    region: oregon
    plan: starter
    dockerfile: kolkata-frontend/Dockerfile
