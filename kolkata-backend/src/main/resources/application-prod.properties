# ============================================================
# Kolkata Real Estate - Spring Boot Production Configuration
# ============================================================

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================================
# Database - Railway MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:${MYSQLHOST}}:${MYSQL_PORT:${MYSQLPORT}}/${MYSQL_DATABASE:${MYSQLDATABASE}}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:${MYSQLUSER:root}}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:${MYSQLPASSWORD}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}
app.upload.base-url=${APP_URL:https://kolkata-backend.onrender.com/api}

# ============================================================
# CORS - Production Hosts
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:https://kolkata-frontend.onrender.com}

# ============================================================
# Logging
# ============================================================
logging.level.com.kolkata=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
