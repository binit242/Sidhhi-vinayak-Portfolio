# ============================================================
# Kolkata Real Estate - Spring Boot Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Database
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kolkata_realestate?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
# Generate a strong secret: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying}
app.jwt.expiration-ms=86400000

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads
app.upload.base-url=http://localhost:8080/api

# ============================================================
# CORS  (adjust origins for production)
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://192.168.0.112:5173

# ============================================================
# Logging
# ============================================================
logging.level.com.kolkata=DEBUG
logging.level.org.springframework.security=INFO
